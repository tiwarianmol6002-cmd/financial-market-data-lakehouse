name: Financial Data Pipeline

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 12:30 UTC = 18:00 IST, Mon-Fri
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: anmol-financial-lakehouse-2026
  VOLUME_PATH: dbfs:/Volumes/finance_lakehouse/bronze/raw_financial_data

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run data ingestion
        run: python src/ingestion/market_data.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Archive raw data in S3
        run: aws s3 sync data/raw/ s3://${{ env.S3_BUCKET }}/raw/ --exclude ".gitkeep"

      - uses: databricks/setup-cli@main

      - name: Copy fresh data into the Databricks volume
        run: |
          for folder in stock_prices financials company_metadata; do
            databricks fs cp -r --overwrite "data/raw/$folder" "$VOLUME_PATH/$folder"
          done

      - name: Validate bundle
        run: databricks bundle validate -t dev

      - name: Deploy bundle
        run: databricks bundle deploy -t dev

      - name: Run Databricks job (bronze, silver, gold, quality checks)
        run: databricks bundle run financial_lakehouse_job -t dev
